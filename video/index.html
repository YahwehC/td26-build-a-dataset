<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MSC Study Guide: demo film</title>
<!-- Demo film for the MSC Study Guide, in the "Shape Morph" style (style 06 / demo 08-morph of mg-styles-15 by
     Vincentwei1021, MIT): one hero shape that keeps morphing into the next icon (A -> circle -> B, with rotation,
     squash & stretch, eased cubic-bezier(.7,0,.3,1)), sub-parts that collapse and grow back in sync, and a colour-field
     wipe that blooms out of the hero on every morph. The morph engine (bez, sampleD, resamplePoly, bestShift, makeM,
     oklab mixing) follows that demo; icons, timeline and data are ours.
     Every frame is a pure function of t: window.renderAt(t). Beat times come from the voiceover (out/cues.json plus the
     pauses inside each line). All numbers come from our CSVs at load time. -->

<script>
(() => {

const EM = bez(0.7, 0, 0.3, 1);      // the morph curve
const EO = bez(0.16, 1, 0.3, 1);     // expo-out: arrivals, text
const EIO = bez(0.45, 0, 0.55, 1);

const backOut = (x, s = 1.70158) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2));

  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return (_ok[h] = [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s]); }
function fromOklab([L, a, b]) {

  const r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, bb = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  return '#' + [r, g, bb].map((c) => Math.round(clamp(toSrgb(clamp(c))) * 255).toString(16).padStart(2, '0')).join(''); }

const tone = (h, dL) => { const A = oklab(h).slice(); A[0] += dL; return fromOklab(A); };
const isLight = (h) => oklab(h)[0] > 0.72;
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ------------------------------------------------------------ geometry */
const NB = 240, NH = 96, NP = 72, NPOOL = 12;
function sampleD(d, n, closed = true) {
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); $('S').appendChild(p);
  const L = p.getTotalLength(), o = [], den = closed ? n : n - 1;
  for (let i = 0; i < n; i++) { const q = p.getPointAtLength(L * i / den); o.push([q.x, q.y]); }
  p.remove(); return o;
}
const area = (P) => { let a = 0; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };
const orient = (P) => (area(P) < 0 ? P.slice().reverse() : P);
const centroid = (P) => { let x = 0, y = 0; for (const p of P) { x += p[0]; y += p[1]; } return [x / P.length, y / P.length]; };
function resamplePoly(P, n) {
  const L = [0]; for (let i = 1; i <= P.length; i++) { const a = P[i - 1], b = P[i % P.length]; L.push(L[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }

  for (let i = 0; i < n; i++) { const s = tot * i / n; while (L[j + 1] < s) j++; const a = P[j], b = P[(j + 1) % P.length], u = (s - L[j]) / ((L[j + 1] - L[j]) || 1); o.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]); }
  return o;
}
const circ = (cx, cy, r, n) => Array.from({ length: n }, (_, i) => { const a = 2 * Math.PI * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
const ell = (cx, cy, rx, ry, n) => Array.from({ length: n }, (_, i) => { const a = 2 * Math.PI * i / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
function bestShift(A, B) { const n = A.length; let best = Infinity, bs = 0;
  for (let s = 0; s < n; s++) { let e = 0; for (let i = 0; i < n; i += 2) { const b = B[(i + s) % n], dx = A[i][0] - b[0], dy = A[i][1] - b[1]; e += dx * dx + dy * dy; if (e >= best) break; } if (e < best) { best = e; bs = s; } }
  return bs; }
const shiftP = (B, s) => B.map((_, i) => B[(i + s) % B.length]);
const alignTo = (A, B) => shiftP(B, bestShift(A, B));
const lerpP = (A, B, t) => A.map((a, i) => [lerp(a[0], B[i][0], t), lerp(a[1], B[i][1], t)]);
const rep = (p, n) => Array.from({ length: n }, () => [p[0], p[1]]);
const scaleAbout = (P, c, sx, sy = sx) => P.map((p) => [c[0] + (p[0] - c[0]) * sx, c[1] + (p[1] - c[1]) * sy]);
const moveP = (P, dx, dy) => P.map((p) => [p[0] + dx, p[1] + dy]);
function rpoly(pts, r) { const n = pts.length; let d = '';
  for (let i = 0; i < n; i++) { const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n], rr = Array.isArray(r) ? r[i] : r;
    const da = Math.hypot(a[0] - p[0], a[1] - p[1]), db = Math.hypot(b[0] - p[0], b[1] - p[1]), k1 = Math.min(rr, da / 2) / da, k2 = Math.min(rr, db / 2) / db;
    d += (i ? 'L' : 'M') + (p[0] + (a[0] - p[0]) * k1) + ',' + (p[1] + (a[1] - p[1]) * k1) + 'Q' + p[0] + ',' + p[1] + ' ' + (p[0] + (b[0] - p[0]) * k2) + ',' + (p[1] + (b[1] - p[1]) * k2); }
  return d + 'Z'; }
function rrPts(x, y, w, h, r, n) {          // analytic rounded rectangle
  r = Math.max(0.01, Math.min(r, w / 2, h / 2));

  for (let i = 0; i < n; i++) { let s = L * i / n, a;
    if (s < L1) { o.push([x + r + s, y]); continue; } s -= L1;
    if (s < A) { a = -Math.PI / 2 + s / r; o.push([x + w - r + r * Math.cos(a), y + r + r * Math.sin(a)]); continue; } s -= A;
    if (s < L2) { o.push([x + w, y + r + s]); continue; } s -= L2;
    if (s < A) { a = s / r; o.push([x + w - r + r * Math.cos(a), y + h - r + r * Math.sin(a)]); continue; } s -= A;
    if (s < L1) { o.push([x + w - r - s, y + h]); continue; } s -= L1;
    if (s < A) { a = Math.PI / 2 + s / r; o.push([x + r + r * Math.cos(a), y + h - r + r * Math.sin(a)]); continue; } s -= A;
    if (s < L2) { o.push([x, y + h - r - s]); continue; } s -= L2;

function capsule(x1, y1, x2, y2, w, n) {

  for (let i = 0; i <= m; i++) o.push(P(r + hw, a0 + (a1 - a0) * i / m));

  for (let i = 0; i <= m; i++) o.push(P(r - hw, a1 - (a1 - a0) * i / m));

/* ------------------------------------------------------------ state filled by build() */
let I, KEYS, FIELDS, IMPS, LANDS, IMGS, CUR, CLICKS, BLOCKS, CALLS, METER, LINES = [], TOTAL = 0, D;
async function csv(url) { const t = await (await fetch(url)).text(); return Papa.parse(t.replace(/^﻿/, ''), { header: true, skipEmptyLines: true }).data; }
const clock = (d) => { let hh = d.getHours(); const mm = String(d.getMinutes()).padStart(2, '0'); const ap = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12; return `${hh}:${mm} ${ap}`; };
const hours = (d) => d.getHours() + d.getMinutes() / 60;

/* ------------------------------------------------------------ icons (local units, origin = visual centre) */

// Preview player (index.html?play): plays the voice + music and draws renderAt(audio time), scaled to the window.
if (new URLSearchParams(location.search).has('play')) {
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080); $('frame').style.cssText = `position:absolute;width:1920px;height:1080px;left:${(innerWidth - 1920 * s) / 2}px;top:${(innerHeight - 56 - 1080 * s) / 2}px;transform:scale(${s});transform-origin:0 0`; };

  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;gap:14px;align-items:center;padding:0 16px;background:#1b1f24;color:#fff;font:600 15px Geist,sans-serif;z-index:9';
  bar.innerHTML = '<button id="pp" style="font:inherit;padding:8px 18px;border-radius:99px;border:0;background:#ff4f2b;color:#fff;cursor:pointer">Play</button><input id="sk" type="range" min="0" max="1000" value="0" style="flex:1"><span id="tm">0:00</span>';
  document.body.appendChild(bar);
  // Web Audio (python's http.server has no Range support, so <audio> cannot seek)
  const ac = new AudioContext();
  const load = (u) => fetch(u, { cache: 'no-cache' }).then((r) => r.arrayBuffer()).then((b) => ac.decodeAudioData(b));
  const pp = bar.querySelector('#pp'), sk = bar.querySelector('#sk'), tm = bar.querySelector('#tm');
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  Promise.all([window.FILM.ready, load('out/voice.wav'), load('out/music.wav')]).then(([{ total }, vb, mb]) => {
    let playing = false, offset = 0, startAt = 0, srcs = [];
    const now = () => (playing ? Math.min(total, offset + ac.currentTime - startAt) : offset);
    const stop = () => { srcs.forEach((x) => { try { x.stop(); } catch (e) {} }); srcs = []; };
    const play = () => {
      stop(); ac.resume();
      srcs = [vb, mb].map((b) => { const x = ac.createBufferSource(); x.buffer = b; x.connect(ac.destination); x.start(0, offset); return x; });
      startAt = ac.currentTime; playing = true; pp.textContent = 'Pause';
    };
    const pause = () => { offset = now(); stop(); playing = false; pp.textContent = 'Play'; };
    pp.onclick = () => (playing ? pause() : play());
    sk.oninput = () => { offset = (sk.value / 1000) * total; if (playing) play(); };
    const loop = () => {
      const t = now();
      if (playing && t >= total) pause();
      window.renderAt(t);
      sk.value = Math.round((t / total) * 1000);
      tm.textContent = `${fmt(t)} / ${fmt(total)}`;
      requestAnimationFrame(loop);
    };
    loop();
  });
}
